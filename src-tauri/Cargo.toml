[package]
name = "recallmd"
version = "0.1.0"
description = "RecallMD — 本地 Markdown 编辑器与主动回忆复习"
edition = "2021"
rust-version = "1.98.1"

# M0 仅验证技术基线；持久化命令（rusqlite、文件安全替换）在后续里程碑加入

[lib]
name = "recallmd_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
tauri-plugin-dialog = "2.7.3"
sha2 = "0.11.0"
uuid = { version = "1.26.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
sha2 = "0.11.0"
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security"] }
