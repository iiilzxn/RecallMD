<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="/recallmd-v2.ico" />
    <title>RecallMD</title>
    <style>
      /* 消除加载期白闪：默认浅色底，深色由下方脚本在渲染前覆盖 */
      html { background: #f5f6f4; }
      html[data-theme="dark"] { background: #161c19; }
    </style>
    <script>
      // 主题引导（与 src/ui/theme.ts 的键语义一致）：React 挂载前设 data-theme，
      // 避免 localStorage 里存了深色的用户启动瞬间白闪
      (function () {
        try {
          var v = localStorage.getItem("recallmd.theme");
          var dark =
            v === "dark" ||
            (v !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage 不可用时按浅色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
